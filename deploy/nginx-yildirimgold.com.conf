server {
    listen 80;
    listen [::]:80;

    server_name yildirimgold.com www.yildirimgold.com;

    root /var/www/yildirimgold.com;
    index index.html;

    access_log /var/log/nginx/yildirimgold.com.access.log;
    error_log /var/log/nginx/yildirimgold.com.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
