server {
    listen 80;
    listen [::]:80;
    server_name yildirimgold.com www.yildirimgold.com;
    return 301 https://yildirimgold.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.yildirimgold.com;

    ssl_certificate /etc/letsencrypt/live/yildirimgold.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yildirimgold.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yildirimgold.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yildirimgold.com;

    root /var/www/yildirimgold.com;
    index index.html;

    access_log /var/log/nginx/yildirimgold.com.access.log;
    error_log /var/log/nginx/yildirimgold.com.error.log;

    ssl_certificate /etc/letsencrypt/live/yildirimgold.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yildirimgold.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }
}
